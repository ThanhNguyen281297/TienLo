<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tiên Lộ · Asset 10–15</title>
<style>body{font:14px Arial;background:#12232c;color:#dcebdc;padding:20px;margin:0}header{position:sticky;top:0;background:#12232cf5;padding:12px 0;z-index:1}h1{font-size:24px;color:#efce97;margin:0 0 12px}input,select{padding:10px;background:#203b42;border:1px solid #65867b;border-radius:6px;color:inherit;margin-right:10px;max-width:90%}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}figure{margin:0;border:1px solid #45666a;background:#1c333e;border-radius:9px;padding:10px}img{width:100%;height:170px;object-fit:contain}figcaption{font-size:11px;color:#b6d5ca;overflow-wrap:anywhere}a{color:#efce97}small{display:block;margin:6px 0}</style>
<header><h1>Thư viện chủ đề · Asset 10–15</h1><input id="search" aria-label="Tìm sprite" placeholder="ID, nguồn hoặc loại…"><select id="atlas" aria-label="Chọn bộ"><option value="">Tất cả</option value="10">10 · Băng tinh</option><option value="11">11 · Cổ ngọc</option><option value="12">12 · Liên hoa</option><option value="13">13 · Hỏa điện</option><option value="14">14 · Linh mộc</option><option value="15">15 · Ma vực</option></select><p id="count"></p></header><main></main>
<script src="../../js/10d-theme-manifest.js"></script><script>
const main=document.querySelector('main'),search=document.querySelector('#search'),atlas=document.querySelector('#atlas');function render(){const matches=themeAtlasSprites.sprites.filter(s=>(!atlas.value||s.id.startsWith('theme-'+atlas.value+'-'))&&(s.id+' '+s.kind+' '+s.original).toLowerCase().includes(search.value.toLowerCase().trim()));document.querySelector('#count').textContent=matches.length+' PNG alpha · nguyên kích thước bản tách nền · cụm dính nhau giữ nguyên';main.replaceChildren();for(const s of matches){const f=document.createElement('figure'),img=document.createElement('img'),caption=document.createElement('figcaption'),link=document.createElement('a'),small=document.createElement('small');img.src='../../'+s.src;img.alt=s.id;img.loading='lazy';link.href=img.src;link.textContent=s.id;small.textContent=s.width+' × '+s.height+' · '+s.kind+' · '+s.original;caption.append(link,small);f.append(img,caption);main.append(f);}}search.oninput=atlas.onchange=render;render();
</script></html>
