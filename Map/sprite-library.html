<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tiên Lộ · Thư viện sprite</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0e1d28;color:#e7dfc4;font:14px Arial,sans-serif}header{position:sticky;top:0;padding:20px 5vw;background:#112432f5;z-index:2;border-bottom:1px solid #647974}h1{font:26px Georgia;margin:0 0 8px}p{color:#a5bdc4;line-height:1.6}input,select{padding:12px;background:#091924;color:#e7dfc4;border:1px solid #617f83;border-radius:8px}input{width:min(400px,70vw)}main{padding:24px 5vw;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}figure{margin:0;border:1px solid #4e6b714f;border-radius:12px;overflow:hidden;background:#172c38}figure img{display:block;width:100%;height:220px;object-fit:contain;padding:15px;background:repeating-conic-gradient(#213541 0% 25%,#1c2f3b 0% 50%) 0/24px 24px}figcaption{padding:14px;overflow-wrap:anywhere}figcaption small{display:block;color:#94b2bf;margin:8px 0}button{border:1px solid #65807c;color:#e5d3a0;background:#203c47;border-radius:5px;padding:7px;cursor:pointer}#count{margin-left:15px;color:#8ed7cb}</style>
<header><a href="atlas-sprites/index.html" style="float:right;color:#8ed7cb">Xem sprite từ cả 9 atlas →</a><h1>Tiên Lộ · Thư viện sprite</h1><p>PNG riêng, nền alpha · tra cứu kích thước và đường dẫn để dựng map. Nguồn gốc giữ nguyên trong catalog.</p><input id="search" placeholder="Tìm sprite…" aria-label="Tìm sprite"><select id="kind" aria-label="Nhóm sprite"><option value="all">Tất cả</option><option value="maps">Map</option><option value="modules">Mảnh địa hình</option><option value="skills">Skill</option><option value="characters">Nhân vật</option><option value="monsters">Quái · từng thao tác</option><option value="items">Vật phẩm</option><option value="npcs">NPC</option></select><span id="count"></span></header><main id="grid"></main>
<script src="../js/10b-sprite-catalog.js"></script><script>
const rows=['maps','modules','skills','characters','monsters','items','npcs'].flatMap(kind=>Object.values(spriteCatalog[kind]).map(asset=>({...asset,kind})));
function render(){const query=document.getElementById('search').value.toLowerCase(),kind=document.getElementById('kind').value,grid=document.getElementById('grid');grid.replaceChildren();const shown=rows.filter(a=>(kind==='all'||kind===a.kind)&&(a.id+' '+a.src).toLowerCase().includes(query));document.getElementById('count').textContent=shown.length+' sprites';for(const asset of shown){const figure=document.createElement('figure'),img=document.createElement('img'),caption=document.createElement('figcaption'),title=document.createElement('b'),size=document.createElement('small'),button=document.createElement('button');img.src='../'+asset.src;img.alt=asset.id;img.loading='lazy';title.textContent=asset.id;size.textContent=asset.width+' × '+asset.height+' · '+asset.src;button.textContent='Sao chép đường dẫn';button.onclick=async()=>{try{await navigator.clipboard.writeText(asset.src);button.textContent='Đã sao chép';}catch{button.textContent=asset.src;}};caption.append(title,size,button);figure.append(img,caption);grid.append(figure);}}
document.getElementById('search').oninput=render;document.getElementById('kind').onchange=render;render();
</script></html>
