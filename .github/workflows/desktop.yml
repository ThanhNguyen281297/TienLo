name: Build desktop client
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Build portable exe
        shell: bash
        working-directory: desktop
        run: |
          mkdir -p build && cp ../Character/App/icon-512.png build/icon.png
          npm install --no-audit --no-fund
          npm run dist
          ls -la dist
      - name: Publish to the desktop-latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view desktop-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create desktop-latest --repo "$GITHUB_REPOSITORY" --title "Tiên Lộ PC (bản mới nhất)" --notes "Bản PC portable tự build từ desktop/." --prerelease
          gh release upload desktop-latest desktop/dist/TienLo-PC.exe --clobber --repo "$GITHUB_REPOSITORY"
