name: Test and deploy Tien Lo
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Backend integration tests
        env:
          TIENLO_QUIET: '1'
        run: |
          python tests/test_online_server.py
          python tests/test_equipment.py
          python tests/test_character_progression.py
          python tests/test_release_stamp.py
          python tests/test_map_sprite_assets.py
          python tests/test_character_expression_assets.py
          python tests/test_expeditions_duels.py
          python tests/test_adventure.py
          python tests/test_mmorpg.py
          python tests/test_basic_effect_assets.py
          python tests/test_prune_releases.py
          python tests/test_player_social.py
          python tests/test_economy.py
          python tests/test_engagement.py
      - name: JavaScript and deployment syntax
        run: |
          for file in js/*.js tests/*.cjs; do node --check "$file"; done
          for file in deploy/*.sh; do bash -n "$file"; done
          python -m compileall -q server.py economy.py community.py trade.py equipment.py progression.py expeditions.py duels.py adventure.py overworld.py forging.py tower.py engagement.py raid.py deploy tests
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    concurrency:
      group: tienlo-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: 116.118.3.118
      DEPLOY_USER: tienlo-deploy
      DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Version browser code and styles
        run: python3 deploy/stamp-release.py "$GITHUB_SHA"
      - name: Configure SSH
        run: |
          test -n "$DEPLOY_KEY" || { echo 'Add VPS_SSH_KEY repository secret first.'; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo 'Add verified VPS_KNOWN_HOSTS repository secret first.'; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/tienlo"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/tienlo" "$HOME/.ssh/known_hosts"
      - name: Synchronize release and activate
        run: |
          export RSYNC_RSH="ssh -i $HOME/.ssh/tienlo -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes"
          destination="$DEPLOY_USER@$DEPLOY_HOST"
          $RSYNC_RSH "$destination" "python3 - --incoming $GITHUB_SHA --keep 5 --apply" < deploy/prune-releases.py
          $RSYNC_RSH "$destination" "mkdir -p /opt/tienlo-releases/$GITHUB_SHA"
          # Checkout timestamps change every run; compare content to reuse asset hardlinks.
          rsync -az --checksum --no-times --delete --chmod=D755,F644 \
            --link-dest=/opt/tienlo \
            --exclude='/.git/' --exclude='/.github/' --exclude='/data/' \
            --exclude='/dist/' --exclude='/tests/' --exclude='/android/' --exclude='__pycache__/' \
            --exclude='*.pyc' --exclude='.env*' --exclude='*.pem' --exclude='*.key' \
            ./ "$destination:/opt/tienlo-releases/$GITHUB_SHA/"
          $RSYNC_RSH "$destination" "sudo -n /usr/local/sbin/tienlo-activate $GITHUB_SHA"
      - name: Verify public HTTPS assets through Nginx
        run: |
          for asset in Character/Kiem/Nam/truoc.png Character/Expressions/Kiem/Nam.png Character/Expressions/Kiem/Nu.png Character/Expressions/Liem/Nam.png Character/Expressions/Liem/Nu.png Character/Expressions/Thuong/Nam.png Character/Expressions/Thuong/Nu.png Character/Expressions/Quat/Nam.png Character/Expressions/Quat/Nu.png Character/Expressions/manifest.json Character/Expressions/Rear/Nam.png Character/Expressions/Rear/Nu.png Map/sprites/pineTree.png Item/VuKhi/Kiem.png Item/PhapBao/9.png Item/PhapTran/1.png Item/PhapTran/2.png Item/PhapTran/3.png Item/PhapTran/5.png Item/Thuan/1.png Item/BuffThuan/4.png Item/DiChuyen/1.png Item/CanhGioi/kimdan.png Item/DHCanhGioi/luyenkhi.png Item/DHCanhGioi/kimtien.png Item/Chan/dai-v2.png Item/TrangPhuc/ngu-sac.png Item/MatNa/slot.svg Item/MatNa/Nam/1.png Item/MatNa/Nu/10.png Skill/Class/manifest.json Skill/VFX/rig-parts-v3.png Skill/VFX/sword-moon-parts-v4.png Character/Monsters/BoCanhVang/animation-v1.png Character/Monsters/Ech/animation-v1.png Character/Monsters/TeGiac/animation-v1.png Character/Monsters/SuaQuy/animation-v1.png Character/Monsters/RongNuoc/animation-v2.png Character/Monsters/BoCap/animation-v2.png Character/Monsters/DungNham/animation-v2.png Character/Monsters/TrauQuy/animation-v1.png Character/Monsters/PhuongHoang/animation-v2.png Character/Monsters/Soi/animation-v2.png Character/Monsters/QuyLiem/animation-v2.png Character/Monsters/RongXuong/animation-v1.png Character/Monsters/animation-frames.json Map/expeditions.json Character/Motion/Kiem-v2.png Character/Motion/Liem-v2.png Character/Motion/Thuong-v2.png Character/Motion/Quat-v2.png Character/Motion/frames.json Character/NPC/nhiemvu.png Map/Terrain/meadow-v1.png Map/Terrain/dirt-v1.png Map/overworld.json Item/NguyenLieu/cuong-hoa-v1.png Item/NguyenLieu/tinh-luyen-v1.png Skill/Basic/Kiem-v2.png Skill/Basic/Liem-v2.png Skill/Basic/Thuong-v2.png Skill/Basic/Quat-v2.png Skill/Basic/parts.json; do
            curl --resolve "mkt.ddnsfree.com:443:$DEPLOY_HOST" --fail --silent --show-error \
              --retry 2 --retry-delay 3 --max-time 20 \
              "https://mkt.ddnsfree.com/$asset?v=$GITHUB_SHA" -o /dev/null
          done
