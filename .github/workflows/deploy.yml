name: Test and deploy Tien Lo
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Build desktop client']
    types: [completed]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Backend integration tests
        env:
          TIENLO_QUIET: '1'
        run: |
          # Each failure is surfaced as an annotation (job logs are not always reachable).
          fail=0
          for t in tests/test_online_server.py \
            tests/test_equipment.py \
            tests/test_character_progression.py \
            tests/test_release_stamp.py \
            tests/test_map_sprite_assets.py \
            tests/test_character_expression_assets.py \
            tests/test_expeditions_duels.py \
            tests/test_adventure.py \
            tests/test_mmorpg.py \
            tests/test_basic_effect_assets.py \
            tests/test_prune_releases.py \
            tests/test_player_social.py \
            tests/test_economy.py \
            tests/test_engagement.py \
            tests/test_webp_assets.py \
            tests/test_battle.py \
            tests/test_outposts.py \
            tests/test_fieldpk.py \
            tests/test_pets_auction.py \
            tests/test_premium_shards_mail.py \
            tests/test_balance.py \
            tests/test_sect_potential.py \
            tests/test_gear_forms.py \
            tests/test_shard_sources.py \
            tests/test_retention.py \
            tests/test_origins.py \
            tests/test_guild_cave.py \
            tests/test_admin.py \
            tests/test_tower.py; do
            if ! python "$t" > out.log 2>&1; then
              cat out.log
              echo "::error title=$t::$(tail -c 1800 out.log | tr '\n' ' ')"
              fail=1
            fi
          done
          exit $fail
      - name: JavaScript and deployment syntax
        run: |
          for file in js/*.js tests/*.cjs; do node --check "$file"; done
          for file in deploy/*.sh; do bash -n "$file"; done
          python -m compileall -q server.py economy.py community.py trade.py equipment.py progression.py expeditions.py duels.py adventure.py overworld.py forging.py tower.py engagement.py raid.py pvp.py battle.py outposts.py fieldpk.py sect_potential.py shards.py deploy tests
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    concurrency:
      group: tienlo-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: 116.118.3.118
      DEPLOY_USER: tienlo-deploy
      DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Restore Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/tienlo-test.keystore
          key: tienlo-android-keystore-v1
      - name: Build Android APK
        run: |
          bash android/build.sh
          mkdir -p Character/App && cp dist/TienLo-Android.apk Character/App/TienLo-Android.apk
      - name: Fetch the PC build (desktop-latest release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download desktop-latest --repo "$GITHUB_REPOSITORY" --pattern TienLo-PC.exe --dir Character/App --clobber \
            || echo 'No PC build published yet; the landing page offers the browser install instead.'
      - name: Bundle browser scripts
        run: python3 deploy/bundle-release.py
      - name: Version browser code and styles
        run: python3 deploy/stamp-release.py "$GITHUB_SHA"
      - name: Configure SSH
        run: |
          test -n "$DEPLOY_KEY" || { echo 'Add VPS_SSH_KEY repository secret first.'; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo 'Add verified VPS_KNOWN_HOSTS repository secret first.'; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/tienlo"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/tienlo" "$HOME/.ssh/known_hosts"
      - name: Synchronize release and activate
        run: |
          export RSYNC_RSH="ssh -i $HOME/.ssh/tienlo -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes"
          destination="$DEPLOY_USER@$DEPLOY_HOST"
          $RSYNC_RSH "$destination" "python3 - --incoming $GITHUB_SHA --keep 5 --apply" < deploy/prune-releases.py
          $RSYNC_RSH "$destination" "mkdir -p /opt/tienlo-releases/$GITHUB_SHA"
          # Checkout timestamps change every run; compare content to reuse asset hardlinks.
          rsync -az --checksum --no-times --delete --chmod=D755,F644 \
            --link-dest=/opt/tienlo \
            --exclude='/.git/' --exclude='/.github/' --exclude='/data/' \
            --exclude='/dist/' --exclude='/tests/' --exclude='/android/' --exclude='__pycache__/' \
            --exclude='*.pyc' --exclude='.env*' --exclude='*.pem' --exclude='*.key' \
            ./ "$destination:/opt/tienlo-releases/$GITHUB_SHA/"
          $RSYNC_RSH "$destination" "sudo -n /usr/local/sbin/tienlo-activate $GITHUB_SHA"
      - name: Verify public HTTPS assets through Nginx
        run: |
          # Use the first domain whose certificate the VPS serves (tienlo2d.xyz once certbot has run).
          site=''
          for host in tienlo2d.xyz mkt.ddnsfree.com; do
            if curl --resolve "$host:443:$DEPLOY_HOST" --fail --silent --max-time 15 "https://$host/" -o /dev/null; then site=$host; break; fi
          done
          test -n "$site" || { echo 'No HTTPS site answered'; exit 1; }
          echo "::notice title=HTTPS::verified through $site"
          # The API must be this game's server (another app on the proxied port answers differently).
          health=$(curl --resolve "$site:443:$DEPLOY_HOST" --silent --max-time 15 "https://$site/api/health" || true)
          case "$health" in *'"storage"'*) ;; *) echo "::error title=API::https://$site/api/health answered: ${health:0:200}"; exit 1;; esac
          for asset in Character/Kiem/Nam/truoc.png Character/Expressions/Kiem/Nam.png Character/Expressions/Kiem/Nu.png Character/Expressions/Liem/Nam.png Character/Expressions/Liem/Nu.png Character/Expressions/Thuong/Nam.png Character/Expressions/Thuong/Nu.png Character/Expressions/Quat/Nam.png Character/Expressions/Quat/Nu.png Character/Expressions/manifest.json Character/Expressions/Rear/Nam.png Character/Expressions/Rear/Nu.png Map/sprites/pineTree.png Item/VuKhi/Kiem.px.png Item/PhapBao/9.px.png Item/PhapTran/1.px.png Item/PhapTran/2.px.png Item/PhapTran/3.px.png Item/PhapTran/5.px.png Item/Thuan/1.px.png Item/BuffThuan/4.px.png Item/DiChuyen/1.px.png Item/CanhGioi/kimdan.png Item/DHCanhGioi/luyenkhi.png Item/DHCanhGioi/kimtien.png Item/Chan/dai-v2.px.png Item/TrangPhuc/ngu-sac.px.png Item/MatNa/slot.svg Item/MatNa/Nam/1.px.png Item/MatNa/Nu/10.px.png Skill/Class/manifest.json Skill/VFX/rig-parts-v3.px.png Skill/VFX/sword-moon-parts-v4.px.png Character/Monsters/BoCanhVang/animation-v1.px.png Character/Monsters/Ech/animation-v1.px.png Character/Monsters/TeGiac/animation-v1.px.png Character/Monsters/SuaQuy/animation-v1.px.png Character/Monsters/RongNuoc/animation-v2.px.png Character/Monsters/BoCap/animation-v2.px.png Character/Monsters/DungNham/animation-v2.px.png Character/Monsters/TrauQuy/animation-v1.px.png Character/Monsters/PhuongHoang/animation-v2.px.png Character/Monsters/Soi/animation-v2.px.png Character/Monsters/QuyLiem/animation-v2.px.png Character/Monsters/RongXuong/animation-v1.px.png Character/Monsters/animation-frames.json Map/expeditions.json Character/NPC/nhiemvu.px.png Map/Terrain/meadow-v1.png Map/Terrain/dirt-v1.png Map/overworld.json Item/NguyenLieu/cuong-hoa-v1.px.png Item/NguyenLieu/tinh-luyen-v1.px.png Skill/Basic/Kiem-v2.px.png Skill/Basic/Liem-v2.px.png Skill/Basic/Thuong-v2.px.png Skill/Basic/Quat-v2.px.png Skill/Basic/parts.json Character/Pixel/Kiem-Nam.png css/pixel/panel.png css/fonts/vt323-vietnamese-400-normal.woff2; do
            curl --resolve "$site:443:$DEPLOY_HOST" --fail --silent --show-error \
              --retry 2 --retry-delay 3 --max-time 20 \
              "https://$site/$asset?v=$GITHUB_SHA" -o /dev/null
          done
