name: Domain check
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve and probe
        run: |
          for host in tienlo2d.xyz www.tienlo2d.xyz mkt.ddnsfree.com; do
            ip=$(getent hosts $host | awk '{print $1}' | head -1)
            http=$(curl -s -o /dev/null -w '%{http_code}->%{redirect_url}' --max-time 15 http://$host/ || true)
            play=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://$host/play || true)
            robots=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://$host/robots.txt || true)
            https=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://$host/ || true)
            cert=$(echo | timeout 10 openssl s_client -servername $host -connect $host:443 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName 2>/dev/null | tr '\n' ' ' || true)
            for scheme in http https; do
              login=$(curl -s -m 15 -H "Origin: $scheme://$host" -H 'Content-Type: application/json' -d '{"username":"probe_x","password":"wrongpassword123"}' $scheme://$host/api/login | head -c 160 || true)
              health=$(curl -s -m 15 $scheme://$host/api/health | head -c 80 || true)
              echo "::notice title=$scheme://$host api::health=$health login=$login"
            done
            echo "::notice title=$host::ip=$ip http=$http https=$https play=$play robots=$robots cert=$cert"
          done
