limit_req_zone $binary_remote_addr zone=tienlo_api:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=tienlo_auth:10m rate=5r/m;

server {
    listen 80;
    server_name mkt.ddnsfree.com;
    root /opt/tienlo;
    index index.html;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location = / { try_files /index.html =404; }
    location = /index.html { add_header Cache-Control "no-store"; }
    # Compress code and data; release URLs carry ?v=<commit>, so code can be cached long.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/javascript text/javascript text/css application/json application/manifest+json image/svg+xml;
    location ~ ^/(js|css)/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ ^/(Character|Map|Item|Skill|CHARACTER|MAP|MONTERS|NPC)/ {
        try_files $uri =404;
        expires 1d;
    }
    location ~ ^/api/(login|register)$ {
        limit_req zone=tienlo_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        limit_req zone=tienlo_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }
    location / { return 404; }
}
