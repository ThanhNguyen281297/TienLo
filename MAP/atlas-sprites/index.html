<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tiên Lộ · 9 atlas</title>
<style>body{margin:0;background:#142731;color:#eadfbe;font:15px Arial}header{padding:24px;position:sticky;top:0;background:#142731f5;z-index:1}h1{font:28px Georgia;margin:0 0 12px}select,input,button{padding:10px;background:#203d49;color:#eadfbe;border:1px solid #627f82;border-radius:6px}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;padding:24px}figure{margin:0;border:1px solid #3d5966;border-radius:8px;overflow:hidden}img{width:100%;height:230px;object-fit:contain;background:repeating-conic-gradient(#253d49 0 25%,#203440 0 50%) 0/24px 24px}figcaption{padding:12px;overflow-wrap:anywhere}small{display:block;margin:8px 0;color:#a6bec4}p{line-height:1.6;max-width:1100px}</style>
<header><h1>Tiên Lộ · Sprite từ 9 atlas</h1><p>Ảnh PNG ở độ phân giải gốc, nền trong suốt, thêm lề 8 px. Kiến trúc liền nhau trong atlas được giữ nguyên thành cụm cảnh; không giả lập phần bị che khuất. Chọn atlas để xem và sao chép đường dẫn.</p><select id="atlas" aria-label="Atlas"><option value="">Cả 9 atlas</option></select> <input id="query" placeholder="Tìm sprite…" aria-label="Tìm sprite"> <span id="total"></span></header><main id="grid"></main>
<script src="../../js/10c-atlas-manifest.js"></script><script>
const select=document.getElementById('atlas'),query=document.getElementById('query'),grid=document.getElementById('grid');for(let i=1;i<=9;i++){const o=document.createElement('option');o.value=String(i).padStart(2,'0');o.textContent='Atlas '+i;select.append(o);}function render(){const rows=mapAtlasSprites.sprites.filter(r=>(!select.value||r.id.startsWith('atlas-'+select.value+'-'))&&r.id.includes(query.value.toLowerCase()));document.getElementById('total').textContent=rows.length+' sprites / cụm cảnh';grid.replaceChildren();for(const r of rows){const f=document.createElement('figure'),im=document.createElement('img'),c=document.createElement('figcaption'),name=document.createElement('b'),s=document.createElement('small'),button=document.createElement('button');im.src='../../'+r.src;im.alt=r.id;im.loading='lazy';name.textContent=r.id;s.textContent=r.width+' × '+r.height+' · '+r.source+' · '+r.kind;button.textContent='Sao chép đường dẫn';button.onclick=async()=>{try{await navigator.clipboard.writeText(r.src);button.textContent='Đã sao chép';}catch{button.textContent=r.src;}};c.append(name,s,button);f.append(im,c);grid.append(f);}}select.onchange=query.oninput=render;render();
</script></html>
